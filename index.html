<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="💰💰">
<title>💰💰</title>
<!-- SheetJS 用於匯出 Excel -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --bg-core: #000000;
  --bg-surface: #0a0a0a;
  --bg-card: #121212;
  --bg-card-hover: #1e1e1e;
  --border-subtle: #262626;
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  --accent: #38bdf8;
  --accent-glow: rgba(56, 189, 248, 0.25);
  --accent-hover: #0ea5e9;
  --danger: #fb7185;
  --success: #34d399;
  --warning: #fbbf24;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
body { background-color: var(--bg-core) !important; color: var(--text-main) !important; min-height: 100vh; padding-bottom: 90px; }

header {
  background-color: var(--bg-surface) !important;
  border-bottom: 1px solid var(--border-subtle);
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.8);
}
.header-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
@media(min-width: 640px) {
  .header-container { flex-direction: row; justify-content: space-between; align-items: center; }
}
.brand-box { display: flex; align-items: center; gap: 12px; }
.brand-title { font-size: 18px; font-weight: 700; color: var(--text-main); letter-spacing: 0.5px; }
.brand-subtitle { font-size: 11px; color: var(--accent); margin-top: 2px; font-family: monospace; }

.month-selector-box {
  display: flex;
  align-items: center;
  background: var(--bg-core);
  padding: 6px 12px;
  border-radius: 10px;
  border: 1px solid var(--border-subtle);
  justify-content: center;
}
.month-selector-box button { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px 10px; font-size: 13px; transition: color 0.2s; }
.month-selector-box button:hover { color: var(--accent); }
.month-selector-box select { background: transparent; border: none; color: white; font-weight: 600; font-size: 13px; cursor: pointer; outline: none; margin: 0 6px; text-align-last: center; }

.tabs-box { display: flex; gap: 6px; width: 100%; }
@media(min-width: 640px) { .tabs-box { width: auto; } }
.tab-btn {
  flex: 1;
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 500;
  border: 1px solid var(--border-subtle);
  background-color: var(--bg-card);
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.25s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.tab-btn:hover { background-color: var(--bg-card-hover); color: var(--text-main); }
.tab-btn.active { background-color: var(--accent); color: #000000; font-weight: 700; border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }

main { max-width: 1200px; margin: 0 auto; padding: 16px; }
.hidden { display: none !important; }

/* Dashboard Grid */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}
@media(min-width: 1024px) {
  .stats-grid { grid-template-columns: repeat(5, 1fr); }
}
.stat-card {
  background-color: var(--bg-card) !important;
  border: 1px solid var(--border-subtle);
  padding: 16px;
  border-radius: 16px;
  color: var(--text-main);
  position: relative;
  overflow: hidden;
  transition: transform 0.2s, border-color 0.2s;
}
.stat-card:hover { border-color: var(--border-subtle); transform: translateY(-2px); }
.stat-card.full-width { grid-column: span 2; }
@media(min-width: 1024px) { .stat-card.full-width { grid-column: span 1; } }
.stat-label { font-size: 11px; color: var(--text-muted); font-weight: 500; letter-spacing: 0.3px; }
.stat-value { font-size: 20px; font-weight: 700; margin-top: 6px; letter-spacing: -0.5px; }

.text-emerald { color: var(--success); }
.text-rose { color: var(--danger); }
.text-blue { color: var(--accent); }
.text-amber { color: var(--warning); }

.card {
  background-color: var(--bg-card) !important;
  border: 1px solid var(--border-subtle);
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 16px;
  color: var(--text-main);
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.card-title { font-size: 14px; font-weight: 700; color: var(--text-main); letter-spacing: 0.3px; }
.card-desc { font-size: 11px; color: var(--text-muted); margin-top: 4px; line-height: 1.4; }

.btn-excel {
  background-color: #065f46;
  color: #34d399;
  border: 1px solid #047857;
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  justify-content: center;
  transition: all 0.2s;
}
.btn-excel:hover { background-color: #047857; color: white; box-shadow: 0 0 15px rgba(52, 211, 153, 0.4); }

/* Tables */
.table-responsive { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; text-align: left; font-size: 12px; color: var(--text-main); }
th { background-color: var(--bg-surface); color: var(--text-muted); padding: 12px; border-bottom: 1px solid var(--border-subtle); font-weight: 600; }
td { padding: 12px; border-bottom: 1px solid rgba(38, 38, 38, 0.8); color: var(--text-main); white-space: nowrap; }
tr:hover { background-color: var(--bg-card-hover); }
.today-row { background-color: rgba(14, 165, 233, 0.12) !important; border-left: 3px solid var(--accent); }

.badge { 
  display: inline-block; 
  padding: 4px 10px; 
  border-radius: 6px; 
  font-size: 11px; 
  font-weight: 600; 
  letter-spacing: 0.3px; 
  white-space: nowrap; 
}
.badge-normal { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
.badge-off { background: #09090b; color: #71717a; border: 1px solid #27272a; }
.badge-leave { background: #451a03; color: #fbbf24; border: 1px solid #78350f; }
.badge-annual { background: #022c22; color: #34d399; border: 1px solid #065f46; }

/* Forms */
.form-grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 16px; }
@media(min-width: 640px) { .form-grid { grid-template-columns: repeat(2, 1fr); } }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group.full { grid-column: span 1; }
@media(min-width: 640px) { .form-group.full { grid-column: span 2; } }
label { font-size: 11px; color: var(--text-muted); font-weight: 500; }
input, select {
  background-color: var(--bg-core) !important;
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  padding: 11px 12px;
  color: white !important;
  font-size: 12px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
.btn-primary {
  background-color: var(--accent);
  color: #000000;
  border: none;
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 0 12px var(--accent-glow);
}
.btn-primary:hover { background-color: var(--accent-hover); box-shadow: 0 0 18px rgba(56, 189, 248, 0.4); }
</style>
</head>
<body>
<header>
  <div class="header-container">
    <div class="brand-box">
      <div>
        <h1 class="brand-title">💰💰</h1>
        <p class="brand-subtitle" id="live-clock">SYNCING TIME...</p>
      </div>
    </div>
    <div class="month-selector-box">
      <button onclick="changeMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
      <select id="month-selector" onchange="onMonthSelectChange(this.value)"></select>
      <button onclick="changeMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
    <div class="tabs-box">
      <button onclick="switchTab('dashboard')" id="tab-dashboard" class="tab-btn active"><i class="fa-solid fa-chart-pie"></i>儀表板</button>
      <button onclick="switchTab('daily')" id="tab-daily" class="tab-btn"><i class="fa-solid fa-pen-to-square"></i>打卡紀錄</button>
      <button onclick="switchTab('admin')" id="tab-admin" class="tab-btn"><i class="fa-solid fa-sliders"></i>後台</button>
    </div>
  </div>
</header>

<main>
  <!-- 1. 儀表板頁面 -->
  <section id="view-dashboard" style="display: flex; flex-direction: column; gap: 16px;">
    <div class="stats-grid">
      <div class="stat-card">
        <p class="stat-label">今日薪資 (實領)</p>
        <h3 class="stat-value text-emerald" id="stat-today-pay">$0</h3>
      </div>
      <div class="stat-card">
        <p class="stat-label">今日遲到扣款</p>
        <h3 class="stat-value text-rose" id="stat-today-late">$0</h3>
      </div>
      <div class="stat-card">
        <p class="stat-label">今日加班加給</p>
        <h3 class="stat-value text-blue" id="stat-today-ot">$0</h3>
      </div>
      <div class="stat-card">
        <p class="stat-label">當月 遲到 / 加班</p>
        <h3 class="stat-value text-amber" id="stat-month-diff" style="font-size: 14px; margin-top: 8px;">遲 -$0 / 加 +$0</h3>
      </div>
      <div class="stat-card full-width" style="background: linear-gradient(135deg, rgba(14,165,233,0.15), var(--bg-card)); border-color: rgba(56,189,248,0.3);">
        <p class="stat-label" style="color: var(--accent);">當月預估總薪資 (含獎金/扣勞健保)</p>
        <h3 class="stat-value text-blue" id="stat-month-total">$0</h3>
      </div>
    </div>

    <div class="card" style="padding: 0; overflow: hidden;">
      <div style="padding: 14px 18px; border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center;">
        <h3 class="card-title">每日出勤與細項明細</h3>
        <span class="card-desc" id="current-month-label" style="margin:0;">--</span>
      </div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>日期</th>
              <th>星期</th>
              <th>狀態</th>
              <th>遲到</th>
              <th>加班</th>
              <th>獎金</th>
              <th style="text-align: right;">實領估算</th>
            </tr>
          </thead>
          <tbody id="dashboard-table-body"></tbody>
        </table>
      </div>
    </div>

    <!-- 匯出報表按鈕 -->
    <div class="card">
      <button onclick="exportToExcel()" class="btn-excel">
        <i class="fa-solid fa-file-excel"></i> 匯出當月 Excel 報表
      </button>
    </div>
  </section>

  <!-- 2. 每日打卡與紀錄頁面 -->
  <section id="view-daily" class="hidden">
    <div class="card">
      <h2 class="card-title" style="margin-bottom: 4px;">每日出勤與細項微調</h2>
      <p class="card-desc" style="margin-bottom: 16px;">選擇特定日期來獨立調整當日的遲到分鐘數、加班時數或手動獎金。</p>
      <div class="form-grid">
        <div class="form-group">
          <label>選擇編輯日期</label>
          <input type="date" id="edit-date" onchange="loadDayDataForEdit()">
        </div>
        <div class="form-group">
          <label>出勤狀態</label>
          <select id="edit-status">
            <option value="normal">正常 (13:00-22:00)</option>
            <option value="leave">請假 (事/病假)</option>
            <option value="annual">特休假 (有薪)</option>
            <option value="off">休假 / 國定假日</option>
          </select>
        </div>
        <div class="form-group">
          <label>遲到分鐘數</label>
          <input type="number" id="edit-late-min" min="0" value="0">
        </div>
        <div class="form-group">
          <label>加班時數 (以30分鐘為單位)</label>
          <select id="edit-ot-hours">
            <option value="0">0 小時</option>
            <option value="0.5">0.5 小時 (30分鐘)</option>
            <option value="1">1 小時</option>
            <option value="1.5">1.5 小時</option>
            <option value="2">2 小時</option>
            <option value="2.5">2.5 小時</option>
            <option value="3">3 小時</option>
            <option value="3.5">3.5 小時</option>
            <option value="4">4 小時</option>
          </select>
        </div>
        <div class="form-group full">
          <label>當日手動獎金 ($)</label>
          <input type="number" id="edit-bonus" min="0" value="0">
        </div>
      </div>
      <button onclick="saveDayData()" class="btn-primary">儲存該日紀錄</button>
    </div>
  </section>

  <!-- 3. 後台管理頁面 -->
  <section id="view-admin" class="hidden">
    <div class="card" style="display: flex; flex-direction: column; gap: 16px;">
      <div>
        <h2 class="card-title">後台參數修正與設定</h2>
        <p class="card-desc">修改後將直接套用至本機快取，並即時影響所有月份的試算公式。</p>
      </div>
      <div class="form-grid" style="border-top: 1px solid var(--border-subtle); padding-top: 16px;">
        <div class="form-group">
          <label>每月底薪</label>
          <input type="number" id="cfg-base-salary">
        </div>
        <div class="form-group">
          <label>勞保固定扣款</label>
          <input type="number" id="cfg-labor-ins">
        </div>
        <div class="form-group">
          <label>健保固定扣款</label>
          <input type="number" id="cfg-health-ins">
        </div>
        <div class="form-group">
          <label>平日每小時基數</label>
          <input type="number" step="0.01" id="cfg-hourly-rate">
        </div>
        <div class="form-group full">
          <label>剩餘特休天數</label>
          <input type="number" id="cfg-annual-leave">
        </div>
      </div>
      <div>
        <button onclick="saveAdminSettings()" class="btn-primary">儲存全部後台參數</button>
      </div>
    </div>
  </section>
</main>

<script>
function getTaiwanCurrentYearMonth() {
  const now = new Date();
  const formatterYear = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Taipei', year: 'numeric' });
  const formatterMonth = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Taipei', month: 'numeric' });
  return {
    year: parseInt(formatterYear.format(now)),
    month: parseInt(formatterMonth.format(now))
  };
}
const taipeiNow = getTaiwanCurrentYearMonth();
let currentYear = taipeiNow.year;
let currentMonth = taipeiNow.month;

let defaultSettings = {
  baseSalary: 37000,
  laborIns: 1015,
  healthIns: 458,
  hourlyRate: 154.17,
  annualLeave: 7
};

let settings = JSON.parse(localStorage.getItem('pwa_salary_settings')) || defaultSettings;
let dbData = JSON.parse(localStorage.getItem('pwa_salary_db')) || {};

function initMonthSelector() {
  const selector = document.getElementById('month-selector');
  selector.innerHTML = '';
  for (let y = 2026; y <= 2031; y++) {
    for (let m = 1; m <= 12; m++) {
      let opt = document.createElement('option');
      opt.value = `${y}-${m}`;
      opt.textContent = `${y} 年 ${m} 月`;
      if (y === currentYear && m === currentMonth) {
        opt.selected = true;
      }
      selector.appendChild(opt);
    }
  }
}

function switchTab(tabId) {
  ['dashboard', 'daily', 'admin'].forEach(t => {
    document.getElementById(`view-${t}`).classList.add('hidden');
    document.getElementById(`tab-${t}`).className = "tab-btn";
  });
  document.getElementById(`view-${tabId}`).classList.remove('hidden');
  document.getElementById(`tab-${tabId}`).className = "tab-btn active";
  if(tabId === 'dashboard') renderDashboard();
  if(tabId === 'admin') loadAdminSettingsToUI();
}

function updateTaiwanClock() {
  const now = new Date();
  const options = { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
  const formatter = new Intl.DateTimeFormat([], options);
  document.getElementById('live-clock').textContent = `TW TIME: ${formatter.format(now)}`;
}
setInterval(updateTaiwanClock, 1000);
updateTaiwanClock();

function getDaysInMonth(year, month) {
  return new Date(year, month, 0).getDate();
}

function calculateOvertimePay(hours, hourlyRate) {
  if (hours <= 0) return 0;
  if (hours === 0.5) return 103;
  if (hours === 1.0) return 206;
  if (hours === 1.5) return 308;
  if (hours === 2.0) return 411;
  if (hours === 2.5) return 539;
  if (hours === 3.0) return 668;
  if (hours === 3.5) return 796;
  if (hours === 4.0) return 925;
  return Math.round(hours * hourlyRate * 4/3);
}

function calculateLateDeduction(minutes) {
  if (minutes <= 0) return 0;
  const perMinuteRate = settings.hourlyRate / 60;
  return Math.round(minutes * perMinuteRate);
}

function renderDashboard() {
  const daysCount = getDaysInMonth(currentYear, currentMonth);
  const tbody = document.getElementById('dashboard-table-body');
  tbody.innerHTML = '';
  let totalMonthLateCost = 0;
  let totalMonthOTPay = 0;
  let totalMonthBonus = 0;
  const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
  const todayStr = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Taipei' });
  let todayPayVal = 0;
  let todayLateVal = 0;
  let todayOTVal = 0;

  for (let d = 1; d <= daysCount; d++) {
    const dateObj = new Date(currentYear, currentMonth - 1, d);
    const dateKey = `${currentYear}-${String(currentMonth).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const dayOfWeek = dateObj.getDay();
    const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
    let dayRecord = dbData[dateKey] || {
      status: isWeekend ? 'off' : 'normal',
      lateMin: 0,
      otHours: 0,
      bonus: 0
    };

    let statusText = '正常';
    let statusBadgeClass = 'badge-normal';
    if (dayRecord.status === 'off') {
      statusText = '休假';
      statusBadgeClass = 'badge-off';
    } else if (dayRecord.status === 'leave') {
      statusText = '請假';
      statusBadgeClass = 'badge-leave';
    } else if (dayRecord.status === 'annual') {
      statusText = '特休';
      statusBadgeClass = 'badge-annual';
    }

    const lateCost = calculateLateDeduction(dayRecord.lateMin);
    const otPay = calculateOvertimePay(dayRecord.otHours, settings.hourlyRate);
    const bonus = Number(dayRecord.bonus) || 0;

    totalMonthLateCost += lateCost;
    totalMonthOTPay += otPay;
    totalMonthBonus += bonus;

    const dailyBase = settings.baseSalary / 22;
    let dayTotal = (dayRecord.status === 'off') ? 0 : Math.round(dailyBase - lateCost + otPay + bonus);

    if (dateKey === todayStr) {
      todayPayVal = dayTotal;
      todayLateVal = lateCost;
      todayOTVal = otPay;
    }

    const tr = document.createElement('tr');
    if (dateKey === todayStr) tr.className = 'today-row';
    tr.innerHTML = `
      <td style="font-weight: 600;">${currentMonth}/${d}</td>
      <td style="color: var(--text-muted);">週${weekdays[dayOfWeek]}</td>
      <td><span class="badge ${statusBadgeClass}">${statusText}</span></td>
      <td style="color: var(--danger);">${dayRecord.lateMin > 0 ? '-' + dayRecord.lateMin + 'm' : '-'}</td>
      <td style="color: var(--accent);">${dayRecord.otHours > 0 ? '+' + dayRecord.otHours + 'h' : '-'}</td>
      <td style="color: var(--success);">${bonus > 0 ? '+$' + bonus : '-'}</td>
      <td style="text-align: right; font-weight: 700;">$${dayTotal}</td>
    `;
    tbody.appendChild(tr);
  }

  const fixedDeduction = Number(settings.laborIns) + Number(settings.healthIns);
  const estimatedTotalSalary = Number(settings.baseSalary) - fixedDeduction - totalMonthLateCost + totalMonthOTPay + totalMonthBonus;

  document.getElementById('stat-today-pay').textContent = `$${todayPayVal}`;
  document.getElementById('stat-today-late').textContent = `$${todayLateVal}`;
  document.getElementById('stat-today-ot').textContent = `$${todayOTVal}`;
  document.getElementById('stat-month-diff').textContent = `遲-$${totalMonthLateCost} / 加+$${totalMonthOTPay}`;
  document.getElementById('stat-month-total').textContent = `$${estimatedTotalSalary}`;
  document.getElementById('current-month-label').textContent = `${currentYear}年${currentMonth}月 (已扣勞健保 $${fixedDeduction})`;
}

function onMonthSelectChange(val) {
  const parts = val.split('-');
  currentYear = parseInt(parts[0]);
  currentMonth = parseInt(parts[1]);
  renderDashboard();
}

function changeMonth(direction) {
  currentMonth += direction;
  if (currentMonth > 12) {
    currentMonth = 1;
    currentYear++;
  } else if (currentMonth < 1) {
    currentMonth = 12;
    currentYear--;
  }
  if (currentYear < 2026) { currentYear = 2026; currentMonth = 1; }
  if (currentYear > 2031) { currentYear = 2031; currentMonth = 12; }
  initMonthSelector();
  renderDashboard();
}

function loadDayDataForEdit() {
  const dateStr = document.getElementById('edit-date').value;
  if (!dateStr) return;
  const record = dbData[dateStr] || { status: 'normal', lateMin: 0, otHours: 0, bonus: 0 };
  document.getElementById('edit-status').value = record.status;
  document.getElementById('edit-late-min').value = record.lateMin;
  document.getElementById('edit-ot-hours').value = record.otHours;
  document.getElementById('edit-bonus').value = record.bonus;
}

function saveDayData() {
  const dateStr = document.getElementById('edit-date').value;
  if (!dateStr) {
    alert('請先選擇日期！');
    return;
  }
  dbData[dateStr] = {
    status: document.getElementById('edit-status').value,
    lateMin: Number(document.getElementById('edit-late-min').value),
    otHours: parseFloat(document.getElementById('edit-ot-hours').value),
    bonus: Number(document.getElementById('edit-bonus').value)
  };
  localStorage.setItem('pwa_salary_db', JSON.stringify(dbData));
  alert('已成功儲存該日紀錄！');
  renderDashboard();
}

function loadAdminSettingsToUI() {
  document.getElementById('cfg-base-salary').value = settings.baseSalary;
  document.getElementById('cfg-labor-ins').value = settings.laborIns;
  document.getElementById('cfg-health-ins').value = settings.healthIns;
  document.getElementById('cfg-hourly-rate').value = settings.hourlyRate;
  document.getElementById('cfg-annual-leave').value = settings.annualLeave;
}

function saveAdminSettings() {
  settings.baseSalary = Number(document.getElementById('cfg-base-salary').value);
  settings.laborIns = Number(document.getElementById('cfg-labor-ins').value);
  settings.healthIns = Number(document.getElementById('cfg-health-ins').value);
  settings.hourlyRate = parseFloat(document.getElementById('cfg-hourly-rate').value);
  settings.annualLeave = Number(document.getElementById('cfg-annual-leave').value);
  localStorage.setItem('pwa_salary_settings', JSON.stringify(settings));
  alert('後台參數已成功更新！');
  renderDashboard();
}

function exportToExcel() {
  const daysCount = getDaysInMonth(currentYear, currentMonth);
  let excelRows = [];
  const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
  for (let d = 1; d <= daysCount; d++) {
    const dateObj = new Date(currentYear, currentMonth - 1, d);
    const dateKey = `${currentYear}-${String(currentMonth).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const dayOfWeek = dateObj.getDay();
    let dayRecord = dbData[dateKey] || { status: (dayOfWeek === 0 || dayOfWeek === 6) ? 'off' : 'normal', lateMin: 0, otHours: 0, bonus: 0 };
    excelRows.push({
      "日期": `${currentYear}/${currentMonth}/${d}`,
      "星期": `週${weekdays[dayOfWeek]}`,
      "出勤狀態": dayRecord.status,
      "遲到分鐘數": dayRecord.lateMin,
      "加班時數(hr)": dayRecord.otHours,
      "當日獎金": dayRecord.bonus
    });
  }
  const worksheet = XLSX.utils.json_to_sheet(excelRows);
  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, `${currentYear}年${currentMonth}月`);
  XLSX.writeFile(workbook, `Payroll_${currentYear}_${currentMonth}.xlsx`);
}

window.onload = function() {
  initMonthSelector();
  const todayStr = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Taipei' });
  const editDateInput = document.getElementById('edit-date');
  editDateInput.value = todayStr;
  loadDayDataForEdit();
  renderDashboard();
};
</script>
